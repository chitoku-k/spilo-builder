name: Build
on:
  pull_request:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  image:
    name: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
    runs-on: ${{ matrix.platform.label }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: linux
            arch: amd64
            label: ubuntu-26.04
          - os: linux
            arch: arm64
            label: ubuntu-26.04-arm
    steps:
      - name: Checkout spilo
        uses: actions/checkout@v7
        with:
          path: spilo
          repository: zalando/spilo
          ref: 4.1-p2
      - name: Checkout spilo-builder
        uses: actions/checkout@v7
        with:
          path: spilo-builder
      - name: Apply patches
        working-directory: spilo
        run: |
          git apply ../spilo-builder/patches/*
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into Container Registry
        if: ${{ inputs.push || false }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build
        uses: docker/build-push-action@v7
        id: build
        with:
          context: ./spilo/postgres-appliance
          tags: ghcr.io/${{ github.repository_owner }}/spilo
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,push=${{ inputs.push || false }},push-by-digest=${{ inputs.push || false }}
      - name: Upload digest
        if: ${{ inputs.push || false }}
        uses: chitoku-k/actions/upload-image-digest@master
        with:
          digest: ${{ fromJSON(steps.build.outputs.metadata)['containerimage.digest'] }}
          artifact: digests-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
